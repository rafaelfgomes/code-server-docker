---
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    hostname: code-server
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - PASSWORD=${WEB_PASSWORD}
      - SUDO_PASSWORD=${ROOT_PASSWORD}
      - DEFAULT_WORKSPACE=/projects
      - PWA_APPNAME=${PWA_APPNAME:-code_server}
    volumes:
      - ${CONFIG_FOLDER:-./config}:/config
      - ${PROJECTS_FOLDER:-./projects}:/projects
    ports:
      - ${PORT:-8443}:8443
    restart: unless-stopped
    networks:
      - net

networks:
  net:
    external: false
